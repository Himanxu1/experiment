version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: excel-analytics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: excel_analytics
      MYSQL_USER: analytics_user
      MYSQL_PASSWORD: analytics_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

volumes:
  mysql_data:
    driver: local
